<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda Laboral</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#68737d;--line:#e1e6eb;--accent:#1769aa;--ok:#16855b;--warn:#c77700;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#102a43;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:20px}
nav{display:flex;gap:8px;margin-top:10px;overflow:auto}nav button{border:0;background:#244a68;color:#fff;padding:9px 12px;border-radius:8px;white-space:nowrap}nav button.active{background:#fff;color:#102a43}
main{max-width:1250px;margin:auto;padding:16px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.controls label{font-size:12px;color:var(--muted);font-weight:600}.controls input,.controls select,.controls textarea{width:100%;padding:9px;border:1px solid #ccd3da;border-radius:8px;background:#fff}
.btn{border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#edf2f7}.success{background:#dff5ea;color:#096b48}.danger{background:#fee4e2;color:#9b1c1c}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}
.list{display:grid;gap:10px}.client{border:1px solid var(--line);border-radius:10px;padding:12px}.client-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.client h3{margin:0 0 3px;font-size:16px}.meta{font-size:12px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:11px;padding:4px 7px;border-radius:999px;background:#eef1f4}.chip.done{background:#dff5ea;color:#096b48}.chip.pending{background:#fff3d6;color:#8a5400}
.gestiones{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;margin-top:10px}.gestiones label{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;display:flex;gap:6px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}th{background:#f7f9fb}
.hidden{display:none}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:600px){main{padding:9px}.client-top{flex-direction:column}.controls{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

.agenda-book{background:#fffdf7;border:1px solid #d8c9a8;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:0 14px 18px;position:relative}
.agenda-book:before{content:"";position:absolute;left:42px;top:0;bottom:0;border-left:2px solid #e7a5a5;opacity:.75}
.book-head{padding:18px 12px 14px 58px;border-bottom:1px solid #d8c9a8}
.book-title{font-family:Georgia,serif;font-size:24px;margin:0 0 4px}
.book-sub{color:#68737d;font-size:13px}
.book-entry{margin-left:58px;padding:14px 8px 14px 0;border-bottom:1px solid #ddd2bc}
.book-entry:last-child{border-bottom:0}
.book-client{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.book-client h3{font-family:Georgia,serif;margin:0;font-size:18px}
.book-meta{font-size:12px;color:#68737d;margin-top:3px}
.book-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.task-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px;margin-top:10px}
.task{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid #ddd6c8;border-radius:6px;background:#fff}
.task.planned{background:#eef5ff}
.task.done{background:#edf8f2;text-decoration:line-through}
.agenda-empty{padding:40px 20px;text-align:center;color:#68737d;font-family:Georgia,serif}
@media(max-width:600px){.agenda-book:before{left:28px}.book-head,.book-entry{margin-left:0;padding-left:40px}.book-client{flex-direction:column}.task-grid{grid-template-columns:1fr}}
.task.done{font-weight:700}
.task input{width:18px;height:18px;accent-color:#16855b}
.sheet-help{font-size:12px;color:#68737d;margin:8px 0 0}
</style>
</head>
<body>
<header><h1>Agenda Laboral</h1><nav>
<button data-tab="agenda" class="active">Agenda</button><button data-tab="clientes">Clientes</button><button data-tab="resumen">Resumen</button><button data-tab="historial">Historial</button><button data-tab="config">Configuración</button>
</nav></header>
<main>
<section id="agenda">
<div class="panel">
<div class="controls">
<label>Vista<select id="view"><option value="day">Día</option><option value="week">Semana</option><option value="month">Mes</option></select></label>
<label>Fecha<input id="date" type="date"></label>
<label>Vendedor<select id="seller"><option value="">Todos</option></select></label>
<label>Zona / Ciudad<select id="city"><option value="">Todas</option></select></label>
<label>Cliente<input id="search" placeholder="Nombre o código"></label>
<label>Frecuencia<select id="freq"><option value="">Todas</option><option>Semanal</option><option>Quincenal</option><option>Mensual</option></select></label><label style="display:flex;align-items:center;gap:8px;padding-top:20px"><input id="onlyPlanned" type="checkbox" onchange="renderAgenda()"> Solo agendados</label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="addClientToSheet()">+ Agregar cliente a la hoja</button><button class="btn secondary" onclick="addManual()">+ Gestión manual</button><button class="btn secondary" onclick="clearAllFilters()">Limpiar filtros</button></div>
</div>
<div id="stats" class="stats"></div>
<div id="agendaList" class="list"></div>
</section>

<section id="clientes" class="hidden">
<div class="panel"><h2>Clientes</h2><div class="controls">
<label>Vendedor<select id="seller2"><option value="">Todos</option></select></label>
<label>Ciudad<select id="city2"><option value="">Todas</option></select></label>
<label>Cliente<input id="search2" placeholder="Nombre o código"></label>
</div></div>
<div id="clientTable"></div>
</section>

<section id="resumen" class="hidden">
<div class="panel"><h2>Resumen de gestión</h2><div class="controls">
<label>Desde<input id="from" type="date"></label><label>Hasta<input id="to" type="date"></label><label>Cliente<input id="summarySearch" placeholder="Nombre o código"></label>
</div></div><div id="summary"></div>
</section>

<section id="historial" class="hidden">
<div class="panel"><h2>Historial</h2><p class="meta">Todas las gestiones guardadas en este dispositivo.</p></div><div id="history"></div>
</section>

<section id="config" class="hidden">
<div class="panel"><h2>Configuración</h2><p>La base inicial contiene <b id="totalClients"></b> clientes del Excel proporcionado.</p>
<button class="btn secondary" onclick="exportData()">Exportar respaldo de gestiones</button>
<button class="btn danger" onclick="resetData()">Borrar todas las gestiones guardadas</button>
</div>
</section>
</main>

const KEY="agenda_laboral_gestiones_v1";
const GEST=["Inventario","Cobros","Pedidos","Toma de lineales","Toma de información"];
let records=JSON.parse(localStorage.getItem(KEY)||"{}");
const today=new Date(); document.getElementById("date").value=iso(today);
document.getElementById("from").value=iso(today); document.getElementById("to").value=iso(today);
document.getElementById("totalClients").textContent=CLIENTS.length;

function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function key(date,code){return date+"__"+code}
function getRec(date,code){let r=records[key(date,code)]||{date,code,done:{},manual:[],notes:""};r.done=r.done||{};r.manual=r.manual||[];r.notes=r.notes||"";r.plan=r.plan||{};Object.keys(r.done).forEach(g=>{if(r.done[g])r.plan[g]=true});if(Object.keys(r.plan).length)r.planned=true;return r}
function clientCode(c){return String(c["Codigo Cliente"]??"")}
function clientName(c){return String(c["Cliente"]??"")}
function populate(){
 const sellers=[...new Set(CLIENTS.map(c=>c["Vendedor"]).filter(Boolean))].sort();
 const cities=[...new Set(CLIENTS.map(c=>c["Ciudad"]).filter(Boolean))].sort();
 ["seller","seller2"].forEach(id=>{let s=document.getElementById(id); sellers.forEach(x=>s.insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`) )});
 ["city","city2"].forEach(id=>{let s=document.getElementById(id); cities.forEach(x=>s.insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`) )});
}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function inPeriod(date,view){
 const d=new Date(date+"T00:00:00"), base=new Date(document.getElementById("date").value+"T00:00:00");
 if(view==="day") return date===iso(base);
 if(view==="week"){let b=new Date(base), day=b.getDay(); b.setDate(b.getDate()-(day||7)+1); let e=new Date(b);e.setDate(e.getDate()+6);return d>=b&&d<=e}
 return d.getFullYear()===base.getFullYear()&&d.getMonth()===base.getMonth()
}
function matches(c){
 let q=document.getElementById("search").value.toLowerCase().trim(), s=document.getElementById("seller").value, city=document.getElementById("city").value, f=document.getElementById("freq").value.toLowerCase();
 return (!q||(clientName(c)+" "+clientCode(c)).toLowerCase().includes(q))&&(!s||c["Vendedor"]===s)&&(!city||c["Ciudad"]===city)&&(!f||String(c["Frecuencia visita (semanal, quincenal o mensual)"]||"").toLowerCase().includes(f.slice(0,-1)))
}
function renderAgenda(){
 let view=document.getElementById("view").value, base=document.getElementById("date").value;
 let only=document.getElementById("onlyPlanned").checked;
 let list=CLIENTS.filter(matches).filter(c=>{
   if(view==="day") return !only || getRec(base,clientCode(c)).planned;
   return true;
 });
 let entries=[];
 if(view==="day"){
   entries=list.map(c=>({date:base,c}));
 }else{
   // In semana/mes se muestran únicamente los clientes realmente agendados.
   Object.values(records).forEach(r=>{
     if(!r.planned || !inPeriod(r.date,view)) return;
     let c=CLIENTS.find(x=>clientCode(x)===String(r.code));
     if(c && matches(c)) entries.push({date:r.date,c});
   });
   entries.sort((a,b)=>a.date.localeCompare(b.date)||clientName(a.c).localeCompare(clientName(b.c)));
   if(!only){
     // No añadimos clientes sin fecha a semana/mes: la agenda representa visitas programadas.
   }
 }
 let done=0, plannedTasks=0, html="";
 entries.forEach(({date,c})=>{
   let rec=getRec(date,clientCode(c));
   const selected=GEST.filter(g=>rec.plan&&rec.plan[g]).length;
   const completed=GEST.filter(g=>rec.done&&rec.done[g]).length;
   plannedTasks+=selected; done+=completed;
   html+=`<article class="book-entry">
    <div class="book-client">
      <div><h3>${esc(clientName(c))}</h3>
      <div class="book-meta"><b>${view==="day"?"Hoy":esc(date)}</b> · Código ${esc(clientCode(c))} · ${esc(c["Vendedor"])} · ${esc(c["Ciudad"])}</div>
      <div class="book-meta">Planificadas: ${selected} · Realizadas: ${completed}</div></div>
      <label class="chip ${rec.planned?"done":"pending"}" style="cursor:pointer"><input type="checkbox" ${rec.planned?"checked":""} onchange="setPlanned('${esc(clientCode(c))}','${esc(date)}',this.checked)"> Agendado</label>
    </div>
    <div class="task-grid">
      ${GEST.map(g=>`<label class="task ${rec.done&&rec.done[g]?"done":""}">
        <input title="Marcar gestión realizada" type="checkbox" ${rec.done&&rec.done[g]?"checked":""} onchange="toggleDate('${esc(clientCode(c))}','${esc(date)}','${esc(g)}',this.checked)">
        <span>${esc(g)}</span>
      </label>`).join("")}
    </div>
    <div class="book-actions"><button class="btn secondary" onclick="manualForDate('${esc(clientCode(c))}','${esc(date)}')">+ Gestión manual</button>
    <button class="btn secondary" onclick="noteForDate('${esc(clientCode(c))}','${esc(date)}')">Observación</button></div>
    ${rec.manual&&rec.manual.length?`<div class="book-meta"><b>Manuales:</b> ${rec.manual.map(esc).join(" · ")}</div>`:""}
    ${rec.notes?`<div class="book-meta"><b>Nota:</b> ${esc(rec.notes)}</div>`:""}
   </article>`;
 });
 // When the day is not showing only planned, add all clients as a selection area below the notebook.
 let selector="";
 if(view==="day" && !only){
   selector=`<div class="panel"><h3>Seleccionar clientes para hoy</h3><p class="meta">Selecciona un cliente y pulsa <b>Agregar a la hoja</b>. Luego marca las gestiones <b>directamente en la hoja</b> cuando las vayas realizando.</p>
   ${CLIENTS.filter(matches).map(c=>{let r=getRec(base,clientCode(c));return `<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><span><b>${esc(clientName(c))}</b><span class="meta"> · ${esc(c["Vendedor"])} · ${esc(c["Ciudad"])}</span></span><button class="btn ${r.planned?"success":"primary"}" onclick="setPlanned('${esc(clientCode(c))}','${esc(base)}',true)">${r.planned?"En la hoja":"Agregar a la hoja"}</button></div>`}).join("")}</div>`;
 }
 document.getElementById("stats").innerHTML=`<div class="stat"><b>${entries.length}</b><span>Clientes en agenda</span></div><div class="stat"><b>${plannedTasks}</b><span>Gestiones planificadas</span></div><div class="stat"><b>${done}</b><span>Gestiones realizadas</span></div>`;
 document.getElementById("agendaList").innerHTML=`<div class="agenda-book"><div class="book-head"><h2 class="book-title">Agenda ${view==="day"?"del día":view==="week"?"de la semana":"del mes"}</h2><div class="book-sub">${esc(base)} · Marca directamente aquí cada gestión que vayas realizando durante la jornada.</div></div>${html||'<div class="agenda-empty">No tienes clientes agendados para este período.<br>Desmarca “Solo agendados” para seleccionar clientes.</div>'}</div>${selector}`;
}
function setPlanned(code,date,value){
 let r=getRec(date,code); r.planned=value;
 if(value && !r.plan) r.plan={};
 if(!value){r.done={};r.plan={};}
 r.updatedAt=new Date().toISOString(); records[key(date,code)]=r; save(); renderAgenda();
}
function setPlan(code,date,g,value){
 let r=getRec(date,code); r.planned=true; r.plan=r.plan||{}; r.plan[g]=value;
 r.updatedAt=new Date().toISOString(); records[key(date,code)]=r; save(); renderAgenda();
}
function toggleDate(code,date,g,value){
 let r=getRec(date,code); r.planned=true; r.done=r.done||{}; r.done[g]=value;
 if(!r.plan) r.plan={}; r.plan[g]=true;
 r.updatedAt=new Date().toISOString(); records[key(date,code)]=r; save(); renderAgenda();
}
function manualForDate(code,date){let r=getRec(date,code),x=prompt("Describe la gestión manual realizada:");if(x){r.planned=true;r.manual=r.manual||[];r.manual.push(x);r.updatedAt=new Date().toISOString();records[key(date,code)]=r;save();renderAgenda()}}
function noteForDate(code,date){let r=getRec(date,code),x=prompt("Observación:",r.notes||"");if(x!==null){r.planned=true;r.notes=x;r.updatedAt=new Date().toISOString();records[key(date,code)]=r;save();renderAgenda()}}
function toggle(code,g){let date=document.getElementById("date").value,r=getRec(date,code);r.done[g]=!r.done[g];r.updatedAt=new Date().toISOString();records[key(date,code)]=r;save();renderAgenda()}
function manualFor(code){let date=document.getElementById("date").value,r=getRec(date,code),x=prompt("Describe la gestión manual realizada:");if(x){r.manual.push(x);r.updatedAt=new Date().toISOString();records[key(date,code)]=r;save();renderAgenda()}}
function noteFor(code){let date=document.getElementById("date").value,r=getRec(date,code),x=prompt("Observación:",r.notes||"");if(x!==null){r.notes=x;r.updatedAt=new Date().toISOString();records[key(date,code)]=r;save();renderAgenda()}}
function addClientToSheet(){
 let only=document.getElementById("onlyPlanned");
 if(document.getElementById("view").value!=="day"){
   alert("Para agregar clientes fácilmente, cambia la vista a Día."); return;
 }
 only.checked=false; renderAgenda();
 setTimeout(()=>{let el=document.querySelector("#agendaList .panel"); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});},50);
}

function addManual(){let code=prompt("Código del cliente:");if(!code)return;let c=CLIENTS.find(x=>clientCode(x)===code);if(!c){alert("Código no encontrado.");return}manualFor(code)}
function clearAllFilters(){["seller","city","search","freq"].forEach(id=>document.getElementById(id).value="");renderAgenda()}
function renderClients(){
 let s=document.getElementById("seller2").value,city=document.getElementById("city2").value,q=document.getElementById("search2").value.toLowerCase();
 let a=CLIENTS.filter(c=>(!s||c["Vendedor"]===s)&&(!city||c["Ciudad"]===city)&&(!q||(clientName(c)+" "+clientCode(c)).toLowerCase().includes(q)));
 document.getElementById("clientTable").innerHTML=`<div class="panel" style="overflow:auto"><table><thead><tr><th>Código</th><th>Cliente</th><th>Vendedor</th><th>Ciudad</th><th>Frecuencia</th><th>Tipo</th></tr></thead><tbody>${a.map(c=>`<tr><td>${esc(clientCode(c))}</td><td>${esc(clientName(c))}</td><td>${esc(c["Vendedor"])}</td><td>${esc(c["Ciudad"])}</td><td>${esc(c["Frecuencia visita (semanal, quincenal o mensual)"])}</td><td>${esc(c["Tipo Cliente"])}</td></tr>`).join("")}</tbody></table></div>`
}
function renderSummary(){
 let from=document.getElementById("from").value,to=document.getElementById("to").value,q=document.getElementById("summarySearch").value.toLowerCase();
 let rows=Object.values(records).filter(r=>r.date>=from&&r.date<=to).filter(r=>{let c=CLIENTS.find(x=>clientCode(x)===r.code);return c&&(!q||(clientName(c)+" "+r.code).toLowerCase().includes(q))});
 let html='<div class="panel" style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Código</th><th>Cliente</th><th>Realizadas</th><th>Pendientes</th><th>Manuales</th><th>Observación</th></tr></thead><tbody>';
 rows.sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{let c=CLIENTS.find(x=>clientCode(x)===r.code),done=GEST.filter(g=>r.done[g]),pend=GEST.filter(g=>!r.done[g]);html+=`<tr><td>${r.date}</td><td>${esc(r.code)}</td><td>${esc(clientName(c))}</td><td>${done.map(esc).join(", ")||"—"}</td><td>${pend.map(esc).join(", ")}</td><td>${r.manual.map(esc).join(" · ")||"—"}</td><td>${esc(r.notes||"")}</td></tr>`});
 document.getElementById("summary").innerHTML=html+"</tbody></table></div>"
}
function renderHistory(){
 let rows=Object.values(records).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
 document.getElementById("history").innerHTML=rows.length?`<div class="panel" style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Gestiones</th><th>Manuales</th><th>Nota</th><th>Última actualización</th></tr></thead><tbody>${rows.map(r=>{let c=CLIENTS.find(x=>clientCode(x)===r.code);return `<tr><td>${r.date}</td><td>${esc(clientName(c)||r.code)}<br><span class="meta">${esc(r.code)}</span></td><td>${GEST.filter(g=>r.done[g]).map(esc).join(", ")||"—"}</td><td>${r.manual.map(esc).join(" · ")||"—"}</td><td>${esc(r.notes||"")}</td><td>${r.updatedAt?new Date(r.updatedAt).toLocaleString():""}</td></tr>`}).join("")}</tbody></table></div>`:'<div class="empty">Todavía no hay gestiones guardadas.</div>'
}
function viewClient(code){document.querySelector('[data-tab="historial"]').click();document.getElementById("summarySearch").value=code;renderHistory()}
function exportData(){let blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="respaldo_agenda_gestiones.json";a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm("¿Borrar TODAS las gestiones guardadas en este dispositivo?")){records={};save();renderAgenda();renderHistory();renderSummary()}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("main>section").forEach(s=>s.classList.add("hidden"));document.getElementById(b.dataset.tab).classList.remove("hidden");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(b.dataset.tab==="agenda")renderAgenda();if(b.dataset.tab==="clientes")renderClients();if(b.dataset.tab==="resumen")renderSummary();if(b.dataset.tab==="historial")renderHistory()});
["view","date","seller","city","search","freq"].forEach(id=>document.getElementById(id).addEventListener("input",renderAgenda));
["seller2","city2","search2"].forEach(id=>document.getElementById(id).addEventListener("input",renderClients));
["from","to","summarySearch"].forEach(id=>document.getElementById(id).addEventListener("input",renderSummary));
populate();renderAgenda();
</script>
</body></html>
